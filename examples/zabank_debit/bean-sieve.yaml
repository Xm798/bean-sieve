# yaml-language-server: $schema=../../bean-sieve.schema.json

defaults:
  currency: HKD
  date_tolerance: 1
  flag: "!"
  output_metadata:
    - order_id
    - source

providers:
  zabank_debit:
    # Keys are the statement's currency sections. A currency exchange is
    # written as a conversion within one account, so both map to the same one.
    accounts:
      HKD: Assets:Bank:ZABank
      CNY: Assets:Bank:ZABank
    # Appends one balance directive per account and currency, dated the day
    # after the statement period ends.
    balance: true

rules:
  - payee: "EMPLOYER\\*A"
    contra_account: Income:Salary
  - payee: "LANDLORD\\*B"
    contra_account: Expenses:Housing:Rent
  - description: "Interest"
    contra_account: Income:Bank:Interest
  - payee: "STORE-C"
    contra_account: Expenses:Shopping
