# yaml-language-server: $schema=../../bean-sieve.schema.json

defaults:
  currency: HKD
  date_tolerance: 1
  flag: "!"
  output_metadata:
    - order_id
    - source

providers:
  welab_debit:
    # Closing balance of each currency section, as a balance assertion.
    balance: true
    # One account per currency section of the statement.
    accounts:
      HKD: Assets:Bank:WeLab:HKD
      CNY: Assets:Bank:WeLab:CNY

rules:
  - payee: "employer-a"
    contra_account: Income:Salary
  - payee: "landlord-b"
    contra_account: Expenses:Housing:Rent
  - description: "service-fee"
    contra_account: Expenses:Bank:Fee
  - description: "interest"
    contra_account: Income:Bank:Interest
  - payee: "store-c"
    contra_account: Expenses:Shopping
