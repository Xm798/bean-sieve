# yaml-language-server: $schema=../../bean-sieve.schema.json

defaults:
  currency: CNY
  date_tolerance: 1
  flag: "!"
  output_metadata:
    - source
  sort_by_time: asc

providers:
  boc_credit:
    # A merged statement lists every card, but each card is repaid on its own.
    accounts:
      "1234": Liabilities:CreditCard:BOC:1234
      "5678": Liabilities:CreditCard:BOC:5678

rules:
  - description: "还款"
    contra_account: Assets:Bank:Checking
  - description: "(store-a|cafe-c)"
    contra_account: Expenses:Food:Meal
  - description: "shop-b"
    contra_account: Expenses:Shopping
