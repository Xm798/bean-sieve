# yaml-language-server: $schema=../../bean-sieve.schema.json

defaults:
  currency: CNY
  date_tolerance: 1
  flag: "!"
  output_metadata:
    - source

providers:
  icbc_debit:
    accounts:
      "1234": Assets:Bank:ICBC

rules:
  - description: "代发工资"
    contra_account: Income:Salary
  - description: "^利息"
    contra_account: Income:Bank:Interest
  - description: "(午餐|晚餐)"
    contra_account: Expenses:Food:Meal
  - description: "水电燃气"
    contra_account: Expenses:Housing:Utilities
  - description: "跨行汇款"
    contra_account: Assets:Bank:CMB
