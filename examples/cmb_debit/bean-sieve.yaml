# yaml-language-server: $schema=../../bean-sieve.schema.json

defaults:
  currency: CNY
  date_tolerance: 1
  flag: "!"
  output_metadata:
    - time
    - source
  sort_by_time: asc

providers:
  cmb_debit:
    accounts:
      "1234": Assets:Bank:CMB

# The CSV has no counterparty column, so rules match on 交易类型 | 交易备注.
rules:
  - description: "代发工资"
    target_payee: employer-a
    contra_account: Income:Salary
  - description: "账户结息"
    contra_account: Income:Bank:Interest
  - description: "(午餐|晚餐)"
    contra_account: Expenses:Food:Meal
  - description: "信用卡还款"
    contra_account: Liabilities:CreditCard:CMB
  - description: "朝朝宝"
    contra_account: Assets:Invest:CMB:ZhaoZhaoBao
  - description: "转账汇款"
    contra_account: Assets:Bank:CCB
