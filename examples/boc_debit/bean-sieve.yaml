# yaml-language-server: $schema=../../bean-sieve.schema.json

defaults:
  currency: CNY
  date_tolerance: 1
  flag: "!"
  output_metadata:
    - time
    - source
  sort_by_time: asc

providers:
  boc_debit:
    # The CSV carries no card number; a single entry applies to every row.
    accounts:
      "1234": Assets:Bank:BOC

rules:
  - description: "代发工资"
    contra_account: Income:Salary
  - description: "结息"
    contra_account: Income:Bank:Interest
  - description: "(午餐|晚餐)"
    contra_account: Expenses:Food:Meal
  - description: "余额提现"
    contra_account: Assets:Alipay:Balance
  - description: "跨行转出"
    contra_account: Assets:Bank:CMB
