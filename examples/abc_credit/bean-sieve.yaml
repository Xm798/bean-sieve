# yaml-language-server: $schema=../../bean-sieve.schema.json

defaults:
  currency: CNY
  date_tolerance: 1
  flag: "!"

providers:
  abc_credit:
    accounts:
      "4321": Liabilities:CreditCard:ABC:4321
    # 刷卡金 used this cycle is booked against this account, unless the ledger
    # already has a matching entry (found by these keywords or the account).
    rebate_income_account: Income:Rebate:ABC
    rebate_keywords:
      - 刷卡金

rules:
  - description: "午餐"
    contra_account: Expenses:Food:Meal
  - description: "约定还款"
    contra_account: Assets:Bank:Checking
  - description: "手续费"
    contra_account: Expenses:Finance:Fee
