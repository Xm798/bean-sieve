# yaml-language-server: $schema=../../bean-sieve.schema.json

defaults:
  currency: CNY
  date_tolerance: 1
  flag: "!"
  output_metadata:
    - time
    - source
  sort_by_time: asc

providers:
  ccb_debit:
    accounts:
      "1234": Assets:Bank:CCB

rules:
  - description: "代发工资"
    contra_account: Income:Salary
  - description: "利息存入"
    contra_account: Income:Bank:Interest
  - description: "账户管理费"
    contra_account: Expenses:Bank:Fee
  - description: "(午餐|晚餐)"
    contra_account: Expenses:Food:Meal
  - description: "信用卡还款"
    contra_account: Liabilities:CreditCard:CCB
  - description: "聚餐AA"
    contra_account: Expenses:Food:Meal
